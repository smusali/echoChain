[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "echoChain"
dynamic = ["version"]
description = "Measure how information degrades across repeated LLM transformations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samir Musali", email = "samir.musali@gmail.com" }]
keywords = [
  "llm",
  "openrouter",
  "evaluation",
  "information-degradation",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "openai>=3,<4",
  "jinja2>=3.1,<4",
  "httpx2>=2,<3",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
baseline = [
  "sentence-transformers>=3.4,<7",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "pytest-socket>=0.8,<1",
  "ruff>=0.14,<1",
  "mypy>=2,<3",
  "pre-commit>=4,<5",
  "pip-audit>=2.9,<3",
  "hypothesis>=6.100,<7",
]

[project.scripts]
echochain = "echochain.cli:main"

[project.urls]
Homepage = "https://github.com/smusali/echoChain"
Repository = "https://github.com/smusali/echoChain"
Issues = "https://github.com/smusali/echoChain/issues"
Changelog = "https://github.com/smusali/echoChain/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/smusali/echoChain/blob/main/docs/USAGE.md"

[tool.hatch.version]
path = "src/echochain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/echochain"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/echochain",
  "tests",
  "schemas",
  "examples",
  "docs",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "tools"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "E", "F", "I", "B", "UP", "SIM", "PL", "D", "PLW1514",
  "S", "PTH", "RUF", "C4", "ARG", "ERA", "PT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "ARG", "PLC0415", "PLR0913", "PLR2004"]
"tools/**" = ["D", "S", "PLR2004"]
"noxfile.py" = ["D"]
"src/echochain/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0917",
]

[tool.pytest.ini_options]
minversion = "9"
addopts = "-ra --strict-markers --strict-config --disable-socket --allow-unix-socket --cov=echochain --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"

[tool.coverage.run]
source = ["echochain"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src/echochain", "tests"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["echochain"]
