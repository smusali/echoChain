[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "echoChain"
version = "0.1.0"
description = "Measure how information degrades across repeated LLM transformations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samir Musali", email = "samir.musali@gmail.com" }]
keywords = [
  "llm",
  "openrouter",
  "evaluation",
  "information-degradation",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "openai>=3,<4",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "pytest-socket>=0.8,<1",
  "jsonschema>=4.23,<5",
  "types-jsonschema>=4.23,<5",
  "ruff>=0.14,<1",
  "mypy>=2,<3",
  "pre-commit>=4,<5",
  "build>=1,<2",
  "twine>=7,<8",
  "pip-audit>=2.9,<3",
]

[project.scripts]
echochain = "echochain.cli:main"

[project.urls]
Homepage = "https://github.com/smusali/echoChain"
Repository = "https://github.com/smusali/echoChain"
Issues = "https://github.com/smusali/echoChain/issues"
Changelog = "https://github.com/smusali/echoChain/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["echochain"]

[tool.hatch.build.targets.sdist]
only-include = [
  "echochain",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "schemas",
  "seeds",
  "examples",
]

[tool.hatch.build.targets.wheel.force-include]
"seeds/v1.toml" = "echochain/seeds/v1.toml"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["echochain", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "D", "PLW1514"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]
"results/**" = ["D100"]
"echochain/**" = ["D100", "D101", "D104", "D105"]
"echochain/prompts.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket --cov=echochain --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["echochain"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["echochain", "tests"]
