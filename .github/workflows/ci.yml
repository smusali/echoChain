name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject stale names
        run: |
          old_repo='llm-'
          old_repo+='telephone'
          old_pkg='llm_'
          old_pkg+='tel'
          old_user='your'
          old_user+='username'
          old_title='LLM '
          old_title+='Telephone'
          pattern="${old_repo}|${old_pkg}|${old_user}|${old_title}"
          hits=$(git grep -nE "$pattern" | grep -vE '^(CHANGELOG\.md|docs/origin/)' || true)
          paths=$(git ls-files | grep -E "$pattern" | grep -vE '^(CHANGELOG\.md|docs/origin/)' || true)
          if [ -n "$hits" ] || [ -n "$paths" ]; then
            printf '%s\n' "$hits" "$paths"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Test
        run: pytest

      - name: Changelog section
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          if not isinstance(project, dict):
              raise SystemExit("project table is missing")
          version = project["version"]
          if not isinstance(version, str):
              raise SystemExit("project.version must be a string")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$",
              re.M,
          )
          if heading.search(changelog) is None:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")
          PY

      - name: Build
        run: |
          python -m build
          twine check --strict dist/*
