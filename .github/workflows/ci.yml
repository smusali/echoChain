name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Help
        run: uv run echochain --help

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Test
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject stale names
        run: |
          old_repo='llm-'
          old_repo+='telephone'
          old_pkg='llm_'
          old_pkg+='tel'
          old_user='your'
          old_user+='username'
          old_title='LLM '
          old_title+='Telephone'
          pattern="${old_repo}|${old_pkg}|${old_user}|${old_title}"
          hits=$(git grep -nE "$pattern" | grep -vE '^(CHANGELOG\.md|docs/origin/)' || true)
          paths=$(git ls-files | grep -E "$pattern" | grep -vE '^(CHANGELOG\.md|docs/origin/)' || true)
          if [ -n "$hits" ] || [ -n "$paths" ]; then
            printf '%s\n' "$hits" "$paths"
            exit 1
          fi

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Changelog section
        run: |
          uv run python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          if not isinstance(project, dict):
              raise SystemExit("project table is missing")
          version = project["version"]
          if not isinstance(version, str):
              raise SystemExit("project.version must be a string")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$",
              re.M,
          )
          if heading.search(changelog) is None:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")
          PY

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      - name: Build
        run: |
          uv run python -m build
          uv run twine check --strict dist/*

  check:
    name: check
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require green jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
