name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Help
        run: uv run echochain --help

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Hypothesis examples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('echochain/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            hypothesis-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Test
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject stale names
        run: |
          old_repo='llm-'
          old_repo+='telephone'
          old_pkg='llm_'
          old_pkg+='tel'
          old_user='your'
          old_user+='username'
          old_title='LLM '
          old_title+='Telephone'
          other='yymss/'
          other+="${old_repo}"
          pattern="${old_repo}|${old_pkg}|${old_user}|${old_title}"
          hits=$(git grep -nE "$pattern" | grep -vE '^CHANGELOG\.md:' | grep -vF "$other" || true)
          paths=$(git ls-files | grep -E "$pattern" | grep -vE '^CHANGELOG\.md$' | grep -vF "$other" || true)
          if [ -n "$hits" ] || [ -n "$paths" ]; then
            printf '%s\n' "$hits" "$paths"
            exit 1
          fi

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Citation
        run: uvx --from cffconvert==2.0.0 cffconvert --validate

      - name: Changelog section
        run: uv run python tools/check_changelog.py

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      - name: Build
        run: |
          uv run python -m build
          uv run twine check --strict dist/*
          uv run python - <<'PY'
          import zipfile
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          needed = [
              "echochain/prompts/a2q.j2",
              "echochain/prompts/q2a.j2",
              "echochain/prompts/identity.j2",
              "echochain/prompts/paraphrase.j2",
              "echochain/prompts/judge_system.j2",
              "echochain/prompts/judge_user.j2",
              "echochain/prompts/answerability_user.j2",
          ]
          missing = [name for name in needed if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing {missing}")
          PY

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Audit
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  check:
    name: check
    if: always()
    needs: [test, package, pip-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require green jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PIP_AUDIT_RESULT: ${{ needs.pip-audit.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$PIP_AUDIT_RESULT" = "success"
