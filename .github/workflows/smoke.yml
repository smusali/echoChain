name: Smoke

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Live cycle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is unset; skipping"
            exit 0
          fi
          uv run echochain models
          uv run echochain --start "Redis uses single-threaded event loops with epoll for I/O multiplexing" --max-cycles 1 --repeats 1 --budget 0.10 --yes
