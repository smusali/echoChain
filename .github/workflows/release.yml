name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Check tag and changelog
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          if not isinstance(project, dict):
              raise SystemExit("project table is missing")
          version = project["version"]
          if not isinstance(version, str):
              raise SystemExit("project.version must be a string")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match version {version}")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$",
              re.M,
          )
          if heading.search(changelog) is None:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")
          PY

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/echochain/
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/echochain/
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086

  github-release:
    needs:
      - build
      - publish-testpypi
      - publish-pypi
    if: >-
      ${{
        !cancelled()
        && needs.build.result == 'success'
        && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Publish GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          if not isinstance(project, dict):
              raise SystemExit("project table is missing")
          version = project["version"]
          if not isinstance(version, str):
              raise SystemExit("project.version must be a string")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\n\[[^\]]+\]: |\Z)",
              re.M | re.S,
          )
          match = section.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
          if [[ "$GITHUB_REF_NAME" == *rc* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
