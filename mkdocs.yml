site_name: echoChain
site_url: https://smusali.github.io/echoChain/
site_description: Measure how information degrades across repeated LLM transformations.
repo_url: https://github.com/smusali/echoChain
repo_name: smusali/echoChain
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Getting Started: index.md
  - Usage: USAGE.md
  - Methodology: METHODOLOGY.md
  - Project:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Security: https://github.com/smusali/echoChain/blob/main/SECURITY.md
